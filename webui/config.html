<html>
<head>
  <title>Requesty Privacy Guard</title>
  <link rel="stylesheet" href="/plugins/requesty/webui/privacy-settings.css">
  <script type="module" src="/plugins/requesty/webui/requesty-store.js"></script>
</head>
<body>
<div x-data>
<template x-if="$store.requesty && config">
<div class="privacy-settings" x-init="$store.requesty.onOpen(context)" x-destroy="$store.requesty.cleanup()" x-effect="$store.requesty.setScope(context)" :aria-busy="$store.requesty.busy">
  <h2 class="section-title">Private model setup</h2>
  <p>If Requesty Privacy Agent protects this installation, all profiles inherit its common key and minimum rules. This editor can create a profile's own model setup; weaker settings and profile toggles do not switch off the installation-wide rules.</p>
  <aside class="privacy-note"><strong>One agent profile at a time.</strong><p>Choose an Agent profile in the toolbar. Keys, privacy rules, model setup and memory storage belong to this selected profile. Global presets and keys are never changed.</p><p x-text="context.agentProfileKey ? 'Selected profile: ' + context.agentProfileKey : 'No profile selected — setup actions are unavailable.'"></p></aside>
  <div x-show="!context.agentProfileKey">
    <p>Requesty is configured for one agent profile. Choose an Agent profile above to edit its saved setup.</p>
    <button class="btn" type="button" x-show="$store.requesty.chatProfile()" @click="$store.requesty.configureProfile(context, $store.requesty.chatProfile())" :disabled="$store.requesty.busy || context.isLoading || context.isSaving">Configure current chat profile</button>
  </div>
  <fieldset x-show="context.agentProfileKey" :disabled="!context.agentProfileKey"><legend>Profile setup</legend>
  <p>Choose where supported Requesty model requests are processed and which provider data rules they must meet.</p>
  <aside class="privacy-note">
    <strong>These models run outside your device.</strong>
    <p>Local embeddings do not prevent conversation or recalled memory text from being sent to a helper model. Local Privacy Guard can replace detected personal details before supported calls; it cannot guarantee complete detection.</p>
    <p>Provider rules below are checked against Requesty's catalog, not independently audited. They do not delete local chats, memory or logs, or verify Requesty's own retention.</p>
    <p>Requesty's hosted PII scanning happens after your text reaches Requesty. Local masking must happen before sending if you want to reduce the personal details Requesty receives. Neither scanner guarantees complete anonymization.</p>
  </aside>
  <details class="privacy-card"><summary>Local masking and Requesty PII scanning</summary>
    <p>Original details may remain visible in your local browser. That does not mean they should be present in outgoing requests.</p>
    <p>Requesty offers Fast and model-based ML scanners on standard and Enterprise plans. Report only records detections and sends text unchanged; Mask replaces detected values before the model provider receives them. This plugin does not enable or verify those organization or group settings.</p>
    <p>Zero Data Retention concerns storage, not the transmission or processing of your text. Higher detection accuracy must be tested with your languages and long conversations.</p>
    <p><a href="https://docs.requesty.ai/features/guardrails" target="_blank" rel="noopener noreferrer">Requesty Guardrails documentation</a></p>
  </details>
  <div class="privacy-status" role="status" aria-live="polite">
    <strong>Next step</strong>
    <p x-text="$store.requesty.nextStep(config, context.hasUnsavedChanges)"></p>
    <p x-show="$store.requesty.message" x-text="$store.requesty.message"></p>
  </div>
  <p class="privacy-error" role="alert" x-show="$store.requesty.error" x-text="$store.requesty.error"></p>
  <section class="privacy-card" aria-labelledby="requesty-access-title">
    <h3 id="requesty-access-title" class="section-title">1. Connect your account</h3>
    <p>You need a Requesty account and API key. A saved key is not yet a verified connection. It is saved only for this profile, not in the shared API Keys list.</p>
    <p x-text="$store.requesty.keyKnown ? ($store.requesty.hasKey ? 'API key: saved' : 'API key: not saved') : 'API key: status unknown'"></p>
    <div class="field"><div class="field-label"><label class="field-title" for="requesty-key">Requesty API key</label></div><div class="field-control"><input id="requesty-key" type="password" autocomplete="off" x-model="$store.requesty.key" :disabled="$store.requesty.busy" placeholder="Paste a new key to save or replace it"></div></div>
    <button class="btn" type="button" @click="$store.requesty.saveKey()" :disabled="$store.requesty.busy || !$store.requesty.key.trim()">Save API key</button>
  </section>
  <section class="privacy-card" aria-labelledby="requesty-policy-title">
    <h3 id="requesty-policy-title" class="section-title">2. Set privacy requirements</h3>
    <fieldset :disabled="$store.requesty.busy">
      <legend>Routing and provider rules</legend>
      <div class="field"><div class="field-label"><label class="field-title" for="requesty-region">Gateway region</label></div><div class="field-control"><select id="requesty-region" x-model="config.region" :disabled="$store.requesty.instanceActive" @change="$store.requesty.invalidateTest()">
        <option value="eu">European Union · Frankfurt</option><option value="us">United States</option><option value="ap">Asia-Pacific</option><option value="global">Global</option>
      </select></div></div>
      <p class="field-description privacy-help">The gateway location and the model's processing location are separate. Use the next requirement to restrict model processing too.</p>
      <div class="field"><div class="field-label"><label class="field-title" for="requesty-switch-1">Require model processing in the selected region</label></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.strict_region" :disabled="$store.requesty.instanceActive" @change="$store.requesty.invalidateTest()" id="requesty-switch-1"><span class="toggler" aria-hidden="true"></span></label></div></div>
      <div class="field"><div class="field-label"><label class="field-title" for="requesty-switch-2">Require the model provider to retain no request data</label></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.no_retention" :disabled="$store.requesty.instanceActive" @change="$store.requesty.invalidateTest()" id="requesty-switch-2"><span class="toggler" aria-hidden="true"></span></label></div></div>
      <div class="field"><div class="field-label"><label class="field-title" for="requesty-switch-3">Require the model provider not to use request data for training</label></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.no_training" :disabled="$store.requesty.instanceActive" @change="$store.requesty.invalidateTest()" id="requesty-switch-3"><span class="toggler" aria-hidden="true"></span></label></div></div>
      <details><summary>Advanced: Requesty organization retention</summary>
        <p>Requesty's own zero data retention (ZDR) cannot currently be verified through the documented API. Requiring verification currently blocks all requests.</p>
        <div class="field"><div class="field-label"><label class="field-title" for="requesty-switch-4">Block requests unless Requesty organization ZDR is verified</label></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.require_requesty_zdr" @change="$store.requesty.invalidateTest()" id="requesty-switch-4"><span class="toggler" aria-hidden="true"></span></label></div></div>
      </details>
    </fieldset>
    <p class="privacy-error" x-show="config.require_requesty_zdr">Requests are blocked by the Requesty organization ZDR requirement.</p>
    <p x-text="!$store.requesty.requirementsSaved ? 'Save to create this profile’s own privacy requirements, even if you keep the defaults.' : context.hasUnsavedChanges ? 'Privacy requirements have unsaved changes.' : 'Privacy requirements match the saved settings. This does not confirm an active chat uses this setup.'"></p>
    <button class="btn" type="button" @click="$store.requesty.saveRequirements(context)" :disabled="$store.requesty.busy || context.isSaving || (!context.hasUnsavedChanges && $store.requesty.requirementsSaved)">Save privacy requirements</button>
  </section>
  <section class="privacy-card" aria-labelledby="requesty-models-title">
    <h3 id="requesty-models-title" class="section-title">3. Choose your models</h3>
    <button class="btn" type="button" @click="$store.requesty.refresh(config)" :disabled="$store.requesty.busy || !$store.requesty.hasKey || context.hasUnsavedChanges">Check connection and load models</button>
    <p class="field-description privacy-help" x-text="$store.requesty.hasKey &amp;&amp; $store.requesty.requirementsSaved ? 'Load the catalog to edit your saved model choices. Loading the catalog makes no LLM requests.' : 'Save a key and the privacy requirements first. Only models that meet the requirements can be selected.'"></p>
    <p x-show="!$store.requesty.catalogLoaded">No model catalog loaded for these settings yet.</p>
    <p class="privacy-note" x-show="$store.requesty.catalogLoaded && !$store.requesty.catalogCurrent(config)">Requirements changed. Reload the catalog before testing.</p>
    <p x-show="$store.requesty.catalogLoaded" x-text="'Catalog loaded: ' + $store.requesty.catalogTime + '. Source: Requesty authenticated catalog. Runtime checks refresh metadata separately.'"></p>
    <p class="privacy-note" x-show="$store.requesty.catalogLoaded && !$store.requesty.allowed().length">No models meet the selected requirements. Open the model details below to inspect rejection reasons. Requirements are not relaxed automatically.</p>
    <fieldset :disabled="$store.requesty.busy || !$store.requesty.catalogCurrent(config) || context.hasUnsavedChanges">
      <legend>Model roles</legend>
      <div class="field"><div class="field-label"><label class="field-title" for="requesty-main">Conversation model (Main)</label><p id="requesty-main-help" class="field-description privacy-help">Handles your conversation and tasks.</p>
      </div><div class="field-control"><select id="requesty-main" aria-describedby="requesty-main-help" x-model="$store.requesty.main" @change="$store.requesty.invalidateTest()"><option value="">Choose a conversation model</option><template x-if="$store.requesty.savedMain &amp;&amp; !$store.requesty.catalogCurrent(config)"><option :value="$store.requesty.savedMain" :selected="$store.requesty.main === $store.requesty.savedMain" x-text="$store.requesty.savedMain + ' (saved)'"></option></template><template x-for="model in $store.requesty.allowed()" :key="model.id"><option :value="model.id" :selected="model.id === $store.requesty.main" x-text="model.id"></option></template></select></div></div>
      <div class="field"><div class="field-label"><label class="field-title" for="requesty-utility">Helper model (Utility)</label><p id="requesty-utility-help" class="field-description privacy-help">Handles background tasks and memory processing. It may receive conversation or recalled memory text.</p>
      </div><div class="field-control"><select id="requesty-utility" aria-describedby="requesty-utility-help" x-model="$store.requesty.utility" @change="$store.requesty.invalidateTest()"><option value="">Choose a helper model</option><template x-if="$store.requesty.savedUtility &amp;&amp; !$store.requesty.catalogCurrent(config)"><option :value="$store.requesty.savedUtility" :selected="$store.requesty.utility === $store.requesty.savedUtility" x-text="$store.requesty.savedUtility + ' (saved)'"></option></template><template x-for="model in $store.requesty.allowed()" :key="model.id"><option :value="model.id" :selected="model.id === $store.requesty.utility" x-text="model.id"></option></template></select></div></div>
    </fieldset>
    <details><summary>Browse catalog and exclusion reasons</summary>
      <div class="field"><div class="field-label"><label class="field-title" for="requesty-search">Search model names</label></div><div class="field-control"><input type="search" id="requesty-search" x-model="$store.requesty.search"></div></div>
      <div class="field"><div class="field-label"><label class="field-title" for="requesty-switch-5">Include excluded models</label></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.requesty.showRejected" id="requesty-switch-5"><span class="toggler" aria-hidden="true"></span></label></div></div>
      <p x-show="$store.requesty.catalogLoaded && !$store.requesty.filtered().length">No results in this view. Clear the search or include excluded models to see more.</p>
      <div class="privacy-table-scroll" tabindex="0" aria-label="Model catalog, scroll horizontally if needed">
        <table><caption>Model requirements according to the catalog</caption><thead><tr><th scope="col">Model</th><th scope="col">Processing location</th><th scope="col">Requirement check</th><th scope="col">Capabilities</th></tr></thead><tbody>
          <template x-for="model in $store.requesty.filtered()" :key="model.id"><tr><th scope="row" x-text="model.id"></th><td x-text="model.geolocation || 'Unknown'"></td><td x-text="model.allowed ? 'Meets selected requirements' : model.reasons.join(' ')"></td><td x-text="'Tools: ' + (model.supports_tool_calling === true ? 'yes' : model.supports_tool_calling === false ? 'no' : 'unknown') + ' · Images: ' + (model.supports_vision === true ? 'yes' : model.supports_vision === false ? 'no' : 'unknown')"></td></tr></template>
        </tbody></table>
      </div>
    </details>
  </section>
  <section class="privacy-card" aria-labelledby="requesty-test-title">
    <h3 id="requesty-test-title" class="section-title">4. Test and create your setup</h3>
    <p>The test sends a fixed artificial example, no chats or memory: at most two requests with up to 256 output tokens each. Small API charges may apply.</p>
    <button class="btn" type="button" @click="$store.requesty.testModels(config, context.hasUnsavedChanges)" :disabled="$store.requesty.busy || context.hasUnsavedChanges || !$store.requesty.catalogCurrent(config) || !$store.requesty.main || !$store.requesty.utility">Run example model test</button>
    <p x-show="$store.requesty.testCurrent(config)">Model test passed for this selection. It expires after 10 minutes and does not independently verify provider privacy claims.</p>
    <div class="field"><div class="field-label"><label class="field-title" for="requesty-preset">Name for this profile model setup</label></div><div class="field-control"><input type="text" id="requesty-preset" x-model="$store.requesty.presetName" :disabled="$store.requesty.busy" maxlength="80"></div></div>
    <button class="btn" type="button" @click="$store.requesty.createPreset(config, context.hasUnsavedChanges)" :disabled="$store.requesty.busy || context.hasUnsavedChanges || !$store.requesty.catalogCurrent(config) || !$store.requesty.testCurrent(config) || !$store.requesty.presetName.trim()">Create model setup</button>
    <p>Creating a setup does not activate it. Activation supplies Main and Utility defaults for this profile. Other native presets remain usable when every model and route meets this profile's requirements; native local endpoints remain available. An incompatible preset blocks model calls without silently replacing your selection.</p>
    <p class="privacy-note" x-show="$store.requesty.createdPreset" x-text="'Created: ' + $store.requesty.createdPreset + ($store.requesty.active ? '. Active for this profile.' : '. Created, not activated.')"></p>
    <p x-show="$store.requesty.createdPreset" x-text="'Saved conversation model: ' + $store.requesty.savedMain + ' · Saved helper model: ' + $store.requesty.savedUtility"></p>
    <p x-show="$store.requesty.active">Native preset selections remain selected and are checked against this profile's requirements. To change this setup, load the catalog, choose models, test and create the replacement.</p>
    <button class="btn" type="button" @click="$store.requesty.activate()" :disabled="$store.requesty.busy || !$store.requesty.createdPreset || $store.requesty.active">Activate for this profile</button>
  </section>
  <details class="privacy-card"><summary>Recommended Requesty account settings</summary>
    <p>These settings apply to the whole Requesty organization, including other applications. They add protection at the gateway; local checks remain necessary.</p>
    <label><input type="checkbox" x-model="$store.requesty.accountSettings.eu_gateway"> Serving region: EU only</label><br>
    <label><input type="checkbox" x-model="$store.requesty.accountSettings.requesty_zdr"> Requesty zero data retention</label><br>
    <label><input type="checkbox" x-model="$store.requesty.accountSettings.provider_zdr"> Zero-data-retention models only</label><br>
    <label><input type="checkbox" x-model="$store.requesty.accountSettings.approved_eu_models"> Approved models reviewed for EU hosting, no retention and no training</label>
    <p>The EU gateway controls Requesty's region, not the provider's model location. Requesty retention and provider retention are separate. Usage telemetry remains. Locked settings may require support to change.</p>
    <p><a href="https://docs.requesty.ai/features/compliance-report" target="_blank" rel="noopener noreferrer">Requesty Compliance instructions</a> · <a href="https://docs.requesty.ai/features/data-privacy" target="_blank" rel="noopener noreferrer">Logging and retention</a></p>
    <img src="/plugins/requesty/webui/requesty-compliance-2026-10-12.png" alt="Example Requesty Compliance page, 12 October 2026: EU serving region, gateway zero retention, provider zero retention and approved models enabled" style="max-width:100%;height:auto">
    <p>Example dated 12 October 2026. The model count of 225 is not a recommended target or proof of your current settings.</p>
    <button type="button" class="btn" @click="$store.requesty.confirmAccount()" :disabled="$store.requesty.busy">Record my confirmation</button>
    <p x-show="$store.requesty.account.confirmed_at" x-text="'User-confirmed: '+$store.requesty.account.confirmed_at+' · Not technically verified'"></p>
    <p>This confirmation does not satisfy or bypass the technically enforced Requesty ZDR requirement.</p>
  </details>
  <details class="privacy-card"><summary>Advanced: memory, images and recovery</summary>
    <p>When Requesty is the helper model, automatic memory updates append entries without consolidating or replacing existing entries. Recall remains available. Manual changes retain standard Agent Zero behavior.</p>
    <p>Existing memory folders and embeddings are preserved. While active, this profile uses a separate memory folder. Existing memories are not copied into it. Main, Browser and separate Vision models must meet the same model-route requirements. Images are processed by the selected service; local text masking does not protect their image content.</p>
    <p>Deactivation stops this profile override and restores its native model selection. It preserves the setup, key and separate memory folder.</p>
    <button class="btn" type="button" @click="$store.requesty.recover()" :disabled="$store.requesty.busy">Deactivate profile setup</button>
    <p>Disabling or uninstalling stops the runtime override; it never rewrites another profile or shared preset.</p>
  </details>
</fieldset>
</div>
</template>
</div>
</body>
</html>
